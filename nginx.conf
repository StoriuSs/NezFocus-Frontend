# nginx inside the production image (nginx-unprivileged: runs as a non-root
# user, so it listens on 8080 instead of 80).
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    # Tells caches (and Cloudflare) to store gzip and plain copies separately.
    gzip_vary on;
    # application/wasm: Rive's runtime for the mascot, 848 kB plain, 353 kB gzipped.
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml application/wasm;
    gzip_min_length 1000;

    # SPA routing — serve index.html for all non-file routes. The fallback is
    # an internal redirect, so its response headers come from `= /index.html`.
    # Real files here (favicon, robots.txt, …) keep their names across deploys,
    # so browsers must revalidate them rather than guess a lifetime.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Vite puts a content hash in every file name here, so they never change.
    # A missing one is a 404, not index.html: serving HTML as a script after a
    # deploy only produces a confusing MIME-type error.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Don't cache index.html (it references hashed assets)
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # This container's settings for the browser, written at start by
    # /docker-entrypoint.d/40-runtime-config.sh. Served from /tmp, so the web
    # root stays read-only to nginx, and never cached: a browser that kept it
    # would use the addresses of an older deploy.
    location = /config.js {
        alias /tmp/config.js;
        default_type application/javascript;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
