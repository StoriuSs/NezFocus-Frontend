# Security headers for every response, included into each location of nginx.conf.
#
# They are included per location, not declared once at server level, because
# nginx only inherits add_header from the enclosing level when a block declares
# NO add_header of its own. Every location in nginx.conf sets Cache-Control, so
# headers declared at server level were silently dropped from every response.
#
# HSTS is not here: it belongs where TLS terminates, the host nginx (see
# nginx/app.conf.template).
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# Content-Security-Policy. The build writes a template from the built pages
# (scripts/csp.mjs); the container fills in this environment's origins at start
# (nginx/40-runtime-config.sh), which is why it is read from /tmp.
include /tmp/csp.conf;
